<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4D5159"/><stop offset="1" stop-color="#1B1D21"/>
    </linearGradient>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0.12"/>
    </linearGradient>
    <!-- Outer rim: lit from the top left. -->
    <linearGradient id="rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Lens: the tile's light and dark swapped, the way a lens flips what is behind it. -->
    <linearGradient id="lens" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1B1D21" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#6A6F78" stop-opacity="0.92"/>
    </linearGradient>
    <!-- Lens rim: opposite the outer rim (bright bottom right), which reads as thickness. -->
    <linearGradient id="lensrim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#FFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="erode" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology operator="erode" radius="13"/><feGaussianBlur stdDeviation="11"/>
    </filter>
    <!-- One piece of glass: the union of ring and stem, with no inner edges. -->
    <mask id="glyph" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><g fill="#FFF"><path d="M289,582 a216,216 0 1 0 432,0 a216,216 0 1 0 -432,0 Z M389,582 a116,116 0 1 0 232,0 a116,116 0 1 0 -232,0 Z" fill-rule="evenodd"/><path d="M631,278.0 a52.0,52.0 0 0 1 104,0 V746.0 a52.0,52.0 0 0 1 -104,0 Z"/></g></mask>
    <!-- Edge light: the glyph minus a shrunken, blurred copy — a soft falloff, never a line. -->
    <mask id="edge" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <g fill="#FFF"><path d="M289,582 a216,216 0 1 0 432,0 a216,216 0 1 0 -432,0 Z M389,582 a116,116 0 1 0 232,0 a116,116 0 1 0 -232,0 Z" fill-rule="evenodd"/><path d="M631,278.0 a52.0,52.0 0 0 1 104,0 V746.0 a52.0,52.0 0 0 1 -104,0 Z"/></g><g fill="#000" filter="url(#erode)"><path d="M289,582 a216,216 0 1 0 432,0 a216,216 0 1 0 -432,0 Z M389,582 a116,116 0 1 0 232,0 a116,116 0 1 0 -232,0 Z" fill-rule="evenodd"/><path d="M631,278.0 a52.0,52.0 0 0 1 104,0 V746.0 a52.0,52.0 0 0 1 -104,0 Z"/></g>
    </mask>
    <clipPath id="outside-disc"><path d="M0,0 H1024 V1024 H0 Z M289,582 a216,216 0 1 0 432,0 a216,216 0 1 0 -432,0 Z" clip-rule="evenodd"/></clipPath>
    <clipPath id="outside-bar"><path d="M0,0 H1024 V1024 H0 Z M631,278.0 a52.0,52.0 0 0 1 104,0 V746.0 a52.0,52.0 0 0 1 -104,0 Z" clip-rule="evenodd"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>
  <g transform="translate(0,16)" opacity="0.52" filter="url(#shadow)" fill="#000"><path d="M289,582 a216,216 0 1 0 432,0 a216,216 0 1 0 -432,0 Z M389,582 a116,116 0 1 0 232,0 a116,116 0 1 0 -232,0 Z" fill-rule="evenodd"/><path d="M631,278.0 a52.0,52.0 0 0 1 104,0 V746.0 a52.0,52.0 0 0 1 -104,0 Z"/></g>
  <rect x="289" y="226" width="446" height="572" fill="url(#body)" mask="url(#glyph)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="#FFF" opacity="0.42" mask="url(#edge)"/>
  <path d="M631,278.0 a52.0,52.0 0 0 1 104,0 V746.0 a52.0,52.0 0 0 1 -104,0 Z" fill="none" stroke="url(#rim)" stroke-width="4" clip-path="url(#outside-disc)"/>
  <circle cx="505" cy="582" r="216" fill="none" stroke="url(#rim)" stroke-width="4" clip-path="url(#outside-bar)"/>
  <circle cx="505" cy="582" r="116" fill="url(#lens)"/>
  <circle cx="505" cy="582" r="116" fill="none" stroke="url(#lensrim)" stroke-width="4"/>
</svg>

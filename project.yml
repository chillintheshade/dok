name: dok
options:
  bundleIdPrefix: com.qingshan
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.4"

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    PRODUCT_NAME: dok
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "8"
    ARCHS:
      - arm64
      - x86_64
    ONLY_ACTIVE_ARCH: false

targets:
  # BSD-3 vendored framework (Vendor/MediaRemoteAdapter).
  # Loaded at runtime by /usr/bin/perl, never linked by the app itself.
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/MediaRemoteAdapter/src
      - path: Vendor/MediaRemoteAdapter/include
    dependencies:
      - sdk: AppKit.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapter
        PRODUCT_BUNDLE_IDENTIFIER: com.vandenbe.MediaRemoteAdapter
        MARKETING_VERSION: "0.7.6"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        DEFINES_MODULE: false
        SKIP_INSTALL: true
        CLANG_ENABLE_OBJC_ARC: true
        # Perl 通过 dlopen + dlsym 调用导出函数，符号必须保持可见。
        GCC_SYMBOLS_PRIVATE_EXTERN: false
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/MediaRemoteAdapter/src"
          - "$(SRCROOT)/Vendor/MediaRemoteAdapter/include"
        USER_HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/MediaRemoteAdapter/src"
          - "$(SRCROOT)/Vendor/MediaRemoteAdapter/include"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9NDTK4FT92
        SWIFT_EMIT_LOC_STRINGS: false

  dok:
    type: application
    platform: macOS
    sources:
      - path: Sources/dok
        type: group
      - path: Resources/AppIcon.icon
      - path: Resources/Assets.xcassets
      - path: Resources/en.lproj/Localizable.strings
      - path: Resources/zh-Hans.lproj/Localizable.strings
      - path: Vendor/MediaRemoteAdapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - target: MediaRemoteAdapter
        embed: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingshan.orbis
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleName: dok
        INFOPLIST_KEY_CFBundleDisplayName: dok
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2025 dok. All rights reserved."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9NDTK4FT92
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: true
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: dok.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: dok.entitlements
